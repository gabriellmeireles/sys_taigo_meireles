# Ambiente de desenvolvimento da plataforma Taigo Meireles.
# Uso: docker compose up -d   (ver README.md)
name: taigo-meireles

services:
  api:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  worker:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["sh", "-c", "php artisan schedule:work & php artisan queue:work --tries=3 --sleep=3"]
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-taigo}
      MYSQL_USER: ${DB_USERNAME:-taigo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taigo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Tradução automática (P-28). Carrega só PT, EN e ES para economizar memória.
  # Os modelos são baixados na primeira vez e ficam no volume libretranslate-models.
  libretranslate:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: pt,en,es
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "true"
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 40

  site:
    build: ./docker/node
    command: ["npx", "ng", "serve", "site", "--host", "0.0.0.0", "--port", "4200"]
    ports:
      - "${SITE_PORT:-4200}:4200"
    volumes:
      - ./frontend:/var/www/frontend

  admin:
    build: ./docker/node
    command: ["npx", "ng", "serve", "admin", "--host", "0.0.0.0", "--port", "4201"]
    ports:
      - "${ADMIN_PORT:-4201}:4201"
    volumes:
      - ./frontend:/var/www/frontend

  # Contêiner utilitário para rodar comandos do Node/Angular (npm, ng)
  node:
    build: ./docker/node
    volumes:
      - ./frontend:/var/www/frontend
      - ./:/var/www/root
    profiles: ["tools"]

volumes:
  db-data:
  libretranslate-models:
